# Your server-specific settings. Copy this file to docker-compose.override.yml:
#   cp docker-compose.override.example.yml docker-compose.override.yml
# Docker Compose merges it with docker-compose.yml automatically, and git ignores it,
# so `git pull` never conflicts with your changes.

services:
  forgeyard:
    # Use other ports on the host:
    # ports: !override
    #   - "9000:8080"
    #   - "9001:8081"

    # --- Behind Caddy running in Docker ---------------------------------------------------
    # Join Caddy's network, so Caddy reaches Forgeyard as forgeyard:8080. Port 8081 stays published:
    # agents connect to it directly with mutual TLS, never through Caddy (with Cloudflare, the record of
    # Forgeyard's address must be "DNS only": Cloudflare's proxy cannot carry it).
    # ports: !override
    #   - "8081:8081"
    # networks:
    #   - default
    #   - caddy
    #
    # Caddyfile (Caddy's container must also join the external network "forgeyard", created by the agent,
    # to reach Traefik). Each app gets its own certificate on its first visit; Caddy asks Forgeyard first,
    # so it only does it for real apps:
    #   {
    #       on_demand_tls {
    #           ask http://forgeyard:8080/api/caddy/ask
    #       }
    #   }
    #   forgeyard.example.com {
    #       reverse_proxy forgeyard:8080
    #   }
    #   https:// {
    #       tls {
    #           on_demand
    #       }
    #       reverse_proxy forgeyard-traefik:80
    #   }
    # In Forgeyard, set the node's network to "behind my proxy".

    # --- Behind Caddy installed on the host ---------------------------------------------
    # Caddyfile:
    #   forgeyard.example.com {
    #       reverse_proxy localhost:8080
    #   }
    # ports: !override
    #   - "127.0.0.1:8080:8080"
    #   - "8081:8081"

    # environment:
      # Proxies allowed to set X-Forwarded-For/-Proto (comma-separated IPs or CIDRs, or "none").
      # Default: loopback and private networks, which covers Caddy on the host or in Docker.
      # FORGEYARD_TRUSTED_PROXIES: "172.20.0.0/16"

      # Keep the key that encrypts secrets out of the data volume (32 bytes, base64:
      # generate one with `openssl rand -base64 32`). Without it, the key is data/secret.key.
      # FORGEYARD_SECRET_KEY: "..."

    # Build from your own copy of the Dockerfile (e.g. to add a CA certificate):
    # build:
    #   dockerfile: Dockerfile.local

# networks:
#   caddy:
#     external: true
