syntax = "proto3";

package forgeyard.agent.v1;

option go_package = "github.com/thomas-bsn/forgeyard/internal/agentpb;agentpb";

// AgentService is served by the control plane. Each agent opens one Connect stream and keeps it open:
// the agent dials out, so nodes need no inbound port. The node is identified by its client certificate.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // Tunnel carries one TCP connection from the control plane to the node's Traefik, for a node that
  // receives its visits through its agent (ingress mode "tunnel"), or an SFTP session to an app's
  // container. The agent opens it when asked by TunnelOpen; its first chunk names the tunnel, then both
  // sides send the connection's bytes. When the agent cannot connect it, its first chunk has eof set and
  // says why in data.
  rpc Tunnel(stream TunnelChunk) returns (stream TunnelChunk);
}

message TunnelChunk {
  string tunnel_id = 1; // only in the agent's first chunk
  bytes data = 2;
  bool eof = 3; // the agent's first chunk: the tunnel could not be connected
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Metrics metrics = 2;
    AppStatuses app_statuses = 3;
    LogLine log_line = 4;
    ExternalContainers external_containers = 5;
    ExecOutput exec_output = 6;
    UpdateFailed update_failed = 7;
    Topology topology = 8;
    UpdateProgress update_progress = 9;
    Uninstalled uninstalled = 10;
    BackupResult backup_result = 11;
    NodeGpus node_gpus = 12;
  }
}

// NodeGpus is what the agent found when it asked Docker for a GPU: sent after each check (at start, and
// on ProbeGpus). A GPU on the machine is not enough: Docker must be able to give it to a container.
message NodeGpus {
  // ok: Docker gives GPUs to containers; unsupported: it cannot (no NVIDIA driver nor NVIDIA Container
  // Toolkit); error: the check itself failed.
  string status = 1;
  string error = 2; // why, for unsupported and error
  repeated Gpu gpus = 3; // those listed, when status is ok (it may be ok with none listed)
}

message Gpu {
  string vendor = 1; // nvidia
  int32 index = 2;
  string id = 3;     // what Docker selects it by: its UUID for NVIDIA
  string name = 4;
  int64 memory_bytes = 5;
}

// Uninstalled answers Uninstall: error is empty when everything was deleted.
message Uninstalled {
  string error = 1;
}

// UpdateProgress tells where the agent's update is: "download" (pulling its new image), then "restart"
// (its container is being replaced; it reconnects with its new version).
message UpdateProgress {
  string step = 1;
}

// Topology is how the node's containers are wired: its Docker networks, who sits on them with which
// address, and which ports they publish and listen on. Sent every few seconds, for the topology views.
message Topology {
  repeated DockerNetwork networks = 1;
  repeated TopoContainer containers = 2;
  repeated VolumeUsage volumes = 3; // the apps' volumes, measured about once a minute
}

message VolumeUsage {
  string name = 1;
  int64 app_id = 2;
  string path = 3; // where it is mounted in the app's container
  int64 size_bytes = 4; // -1 when not measured yet
  int64 stack_id = 5; // a named volume of a stack, app_id 0
  string volume = 6;  // its name in the stack's compose file
}

message DockerNetwork {
  string id = 1;
  string name = 2;
  string driver = 3; // bridge, host, overlay…
  string subnet = 4;
  bool internal = 5; // no way out of the node
}

message TopoContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  // role: app (a Forgeyard app, app_id set), traefik, server, agent or external.
  string role = 5;
  int64 app_id = 6;
  repeated NetworkEndpoint endpoints = 7;
  repeated PublishedPort published = 8;
  repeated int32 listening = 9; // TCP ports it listens on (not loopback), while running
  string compose_project = 10;
}

message NetworkEndpoint {
  string network = 1;
  string ipv4 = 2;
  repeated string aliases = 3; // names the other containers of the network reach it by
}

message PublishedPort {
  int32 container_port = 1;
  int32 host_port = 2;
  string protocol = 3;
  string host_ip = 4;
}

// UpdateFailed tells why the agent could not update itself; it keeps running its current version.
message UpdateFailed {
  string error = 1;
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    DesiredState desired_state = 2;
    StartLogs start_logs = 3;
    StopLogs stop_logs = 4;
    ContainerAction container_action = 5;
    ExecStart exec_start = 6;
    ExecInput exec_input = 7;
    ExecResize exec_resize = 8;
    ExecClose exec_close = 9;
    UpdateAgent update_agent = 10;
    DropAppData drop_app_data = 11;
    Uninstall uninstall = 12;
    TunnelOpen tunnel_open = 13;
    DropStack drop_stack = 14;
    BackupJob backup_job = 15;
    ProbeGpus probe_gpus = 16;
  }
}

// ProbeGpus asks the agent to check its GPUs again; it answers with NodeGpus.
message ProbeGpus {}

// TunnelOpen asks the agent to open a Tunnel stream for this ID and connect it to the node's Traefik, or
// to an SFTP server in an app's container when sftp_app_id is set.
message TunnelOpen {
  string tunnel_id = 1;
  int64 sftp_app_id = 2;
}

// DropStack deletes what a deleted stack left on the node: its containers, if still there, and its network;
// its volumes too when the deletion said so.
message DropStack {
  int64 stack_id = 1;
  bool volumes = 2;
}

// BackupJob asks the agent to back up a volume to the restic repository, list its snapshots, or restore one
// into a new volume. It answers with a BackupResult of the same id.
message BackupJob {
  string id = 1;
  string op = 2; // backup, snapshots, restore
  Restic restic = 3;
  // The volume backed up: its files, or the database of the container that uses it when postgres is set.
  string volume = 4;
  string tag = 5; // the policy's tag on its snapshots: forget, list and restore stay within it
  int32 keep = 6; // backup: the snapshots kept
  Postgres postgres = 7;
  string snapshot = 8;       // restore: the snapshot
  string target_volume = 9;  // restore: the new volume, created by the agent
  map<string, string> target_labels = 10;
}

// Restic is where the snapshots go: a repository on an S3-compatible storage.
message Restic {
  string repository = 1; // s3:https://host/bucket/prefix
  string password = 2;
  string access_key = 3;
  string secret_key = 4;
  string region = 5;
  string network = 6; // the Docker network the restic container joins, empty for the default one
}

// Postgres backs up a database with pg_dump run in its container, and restores it with pg_restore in a
// short-lived container of the same image.
message Postgres {
  string container = 1;
  string user = 2;
  string database = 3;
  string password = 4;
  string image = 5;
  string data_path = 6; // where its data volume is mounted: the restore container mounts the new volume there
  string pgdata = 7;    // its PGDATA, when the service sets one
}

message BackupResult {
  string id = 1;
  string error = 2;
  string snapshot = 3;    // backup: the new snapshot
  int64 size_bytes = 4;   // backup: what it added
  repeated Snapshot snapshots = 5;
  string log = 6;         // the end of the tools' output, when it failed
}

message Snapshot {
  string id = 1;
  int64 time = 2;
  int64 size_bytes = 3;
}

// Uninstall: the node is being removed. The agent deletes what Forgeyard put on it (the apps' containers
// and volumes, Traefik, the forgeyard network), answers Uninstalled, then deletes its own container and
// identity (unless Docker Compose manages it).
message Uninstall {}

// DropAppData deletes the volumes of an app that was deleted. Volumes are never deleted otherwise: an app
// leaving a node, or a desired state received wrong, keeps its data.
message DropAppData {
  int64 app_id = 1;
}

// UpdateAgent asks the agent to replace its own container with one of this image, same settings.
message UpdateAgent {
  string image = 1;
}

// Hello is the first message of a stream.
message Hello {
  string agent_version = 1; // the commit it was built from, empty for a development build
  NodeInfo info = 2;
  // self_update: the agent runs in a container it can replace (not one Docker Compose manages).
  bool self_update = 3;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  int32 cpus = 4;
  uint64 memory_bytes = 5;
  uint64 disk_bytes = 6;
  string docker_version = 7;
  string local_ip = 8; // the host's IP on its local network, for a reverse proxy to reach Traefik
  string docker_error = 9; // why Docker could not be reached, when it could not
}

// Metrics is sent every few seconds.
message Metrics {
  int64 unix_time = 1;
  double cpu_percent = 2;
  uint64 memory_used_bytes = 3;
  uint64 disk_used_bytes = 4;
  int32 containers_running = 5;
  // gpus: the use of each GPU, while an app of the node uses GPUs. A GPU as a whole: Docker does not
  // measure it per container, and the apps sharing a GPU share these figures.
  repeated GpuMetric gpus = 6;
}

message GpuMetric {
  string id = 1; // its UUID, as in Gpu
  double utilization_percent = 2;
  int64 memory_used_bytes = 3;
  int64 memory_total_bytes = 4;
  double temperature_c = 5;
  double power_watts = 6;
}

// Welcome answers Hello once the node is recognized.
message Welcome {
  int64 node_id = 1;
  string node_name = 2;
}

// DesiredState is everything that must run on the node. It is sent after Welcome and whenever it changes;
// the agent makes Docker match it: creates, updates and removes containers, and runs the ingress proxy.
message DesiredState {
  repeated AppSpec apps = 1;
  Ingress ingress = 2;
  // Relays are apps of other nodes behind the same public IP: this node's Traefik receives their
  // requests and passes them on to those nodes over the local network.
  repeated Relay relays = 3;
}

message Relay {
  string hostname = 1; // the app's domain name
  string target = 2;   // where its node's Traefik listens, e.g. http://192.168.1.20:8090
}

message AppSpec {
  int64 id = 1;
  string name = 2;
  string image = 3;
  int32 port = 4; // port the app listens on inside its container
  map<string, string> env = 5;
  string hostname = 6; // full domain name routed to the app; empty publishes the port on the node instead
  bool running = 7;
  int64 memory_bytes = 8;
  int64 generation = 9; // bumped to force a redeploy (fresh pull, new container)
  // leaving: the app moves to another node and keeps running here until it is online there; its status is
  // not reported, the new node's is.
  bool leaving = 10;
  // dockerfile: when set, the node builds the image from it, tagged image, instead of pulling image.
  string dockerfile = 11;
  // sandbox: a Linux box reached over SSH: kept running by a idle command, without a web route nor a
  // published port, its /root on a volume of the node.
  bool sandbox = 12;
  // volumes: paths of the container kept across redeployments, each on a Docker volume of the node named
  // after the app and the path. An app with volumes is stopped before its next version starts: two
  // versions must not write the same files.
  repeated string volumes = 13;
  // stack: the app is a service of a compose stack.
  StackService stack = 14;
  // gpu: the app may use GPUs of the node; none without it. Access, not a reservation: other apps may use
  // the same GPUs and their memory.
  GpuRequest gpu = 15;
  reserved 16; // git_commit: apps deployed by git push, removed
}

message GpuRequest {
  string vendor = 1;                // nvidia
  bool all = 2;                     // every GPU of the node
  repeated string device_ids = 3;   // or these
}

// StackService is how a service of a stack runs: on the stack's own network, reached there by its service
// name, after the services it depends on.
message StackService {
  int64 stack_id = 1;
  string network = 2;
  string service = 3;
  repeated string command = 4;    // empty: the image's own
  repeated string entrypoint = 5; // empty: the image's own
  Healthcheck healthcheck = 6;
  string restart = 7; // no, always, on-failure[:N], unless-stopped; empty: unless-stopped
  // job: another service waits for it to complete. It runs once per version, and is not restarted.
  bool job = 8;
  repeated Dependency depends_on = 9;
  repeated NamedVolume volumes = 10;
}

message Healthcheck {
  repeated string test = 1;
  int64 interval_ns = 2;
  int64 timeout_ns = 3;
  int64 start_period_ns = 4;
  int32 retries = 5;
}

message Dependency {
  int64 app_id = 1;
  string service = 2;
  string condition = 3; // service_started, service_healthy, service_completed_successfully
}

message NamedVolume {
  string name = 1;   // the Docker volume
  string target = 2;
  bool read_only = 3;
  string volume = 4; // its name in the compose file
}

message Ingress {
  // "traefik": Traefik listens on 80/443 and gets HTTPS certificates itself.
  // "proxy": Traefik listens on http_port in plain HTTP, behind a proxy the user runs (Caddy…).
  // "tunnel": Traefik listens in plain HTTP on no port of the machine: visits come through the agent's
  // Tunnel streams.
  string mode = 1;
  int32 http_port = 2;
}

message AppStatuses {
  repeated AppStatus apps = 1;
}

message AppStatus {
  int64 app_id = 1;
  // pulling, building, creating, deploying, running, restarting, stopped, exited, error; for a service of a
  // stack also waiting (for its dependencies), blocked (one failed), and completed or failed for a job
  string state = 2;
  int32 exit_code = 3;
  bool oom_killed = 4;
  string error = 5;
  int64 started_at = 6;
  int32 host_port = 7; // when the app has no hostname
  int32 restart_count = 8;
  // Resource use of the running container: CPU in percent of one core, memory without the page cache.
  double cpu_percent = 9;
  uint64 memory_used_bytes = 10;
  // The TCP ports the running container listens on (not on loopback), to spot a wrong port setting.
  repeated int32 listening_ports = 11;
  // waiting_for: what a service of a stack waits for before it starts (state "waiting").
  string waiting_for = 12;
  // What the container may use, for cpu_percent (in percent of one core): the node's cores as Docker sees
  // them, and the container's own CPU limit in cores (0 without one).
  double cpu_cores = 13;
  double cpu_limit = 14;
}

message StartLogs {
  string stream_id = 1;
  int64 app_id = 2;
  int32 tail = 3;
  string container_id = 4; // an external container, when app_id is 0
  bool agent = 5; // the agent's own log, since it started
}

// ExternalContainers lists the node's containers that Forgeyard did not create (started by hand, by
// docker compose…), sent every few seconds. Forgeyard's own containers are left out.
message ExternalContainers {
  repeated ExternalContainer containers = 1;
}

message ExternalContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;  // running, exited, restarting, paused, created…
  string status = 5; // Docker's human-readable status, e.g. "Up 3 hours"
  int64 created_at = 6;
  repeated string ports = 7; // published ports, e.g. "8080->80/tcp"
  double cpu_percent = 8;
  uint64 memory_used_bytes = 9;
  string compose_project = 10;
  double cpu_cores = 11; // as in AppStatus
  double cpu_limit = 12;
}

// ContainerAction starts, stops or restarts an external container.
message ContainerAction {
  string container_id = 1;
  string action = 2; // start, stop, restart
}

message StopLogs {
  string stream_id = 1;
}

message LogLine {
  string stream_id = 1;
  string text = 2;
  bool stderr = 3;
  bool end = 4; // the stream is over (container gone or error in text)
}

// A terminal in a container: a shell with a TTY, opened by ExecStart and fed by ExecInput; its output
// comes back as ExecOutput until one with closed set.
message ExecStart {
  string session_id = 1;
  int64 app_id = 2;
  string container_id = 3; // an external container, when app_id is 0
  uint32 cols = 4;
  uint32 rows = 5;
  string command = 6; // run by the container's shell instead of an interactive shell (ssh app command)
}

message ExecInput {
  string session_id = 1;
  bytes data = 2;
}

message ExecResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ExecClose {
  string session_id = 1;
}

message ExecOutput {
  string session_id = 1;
  bytes data = 2;
  bool closed = 3;    // the shell ended: nothing follows
  int32 exit_code = 4;
  string error = 5;   // why it could not start or broke
}
