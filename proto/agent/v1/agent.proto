syntax = "proto3";

package forgeyard.agent.v1;

option go_package = "github.com/thomas-bsn/forgeyard/internal/agentpb;agentpb";

// AgentService is served by the control plane. Each agent opens one Connect stream and keeps it open:
// the agent dials out, so nodes need no inbound port. The node is identified by its client certificate.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Metrics metrics = 2;
    AppStatuses app_statuses = 3;
    LogLine log_line = 4;
    ExternalContainers external_containers = 5;
    ExecOutput exec_output = 6;
  }
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    DesiredState desired_state = 2;
    StartLogs start_logs = 3;
    StopLogs stop_logs = 4;
    ContainerAction container_action = 5;
    ExecStart exec_start = 6;
    ExecInput exec_input = 7;
    ExecResize exec_resize = 8;
    ExecClose exec_close = 9;
  }
}

// Hello is the first message of a stream.
message Hello {
  string agent_version = 1;
  NodeInfo info = 2;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  int32 cpus = 4;
  uint64 memory_bytes = 5;
  uint64 disk_bytes = 6;
  string docker_version = 7;
  string local_ip = 8; // the host's IP on its local network, for a reverse proxy to reach Traefik
  string docker_error = 9; // why Docker could not be reached, when it could not
}

// Metrics is sent every few seconds.
message Metrics {
  int64 unix_time = 1;
  double cpu_percent = 2;
  uint64 memory_used_bytes = 3;
  uint64 disk_used_bytes = 4;
  int32 containers_running = 5;
}

// Welcome answers Hello once the node is recognized.
message Welcome {
  int64 node_id = 1;
  string node_name = 2;
}

// DesiredState is everything that must run on the node. It is sent after Welcome and whenever it changes;
// the agent makes Docker match it: creates, updates and removes containers, and runs the ingress proxy.
message DesiredState {
  repeated AppSpec apps = 1;
  Ingress ingress = 2;
}

message AppSpec {
  int64 id = 1;
  string name = 2;
  string image = 3;
  int32 port = 4; // port the app listens on inside its container
  map<string, string> env = 5;
  string hostname = 6; // full domain name routed to the app; empty publishes the port on the node instead
  bool running = 7;
  int64 memory_bytes = 8;
  int64 generation = 9; // bumped to force a redeploy (fresh pull, new container)
}

message Ingress {
  // "traefik": Traefik listens on 80/443 and gets HTTPS certificates itself.
  // "proxy": Traefik listens on http_port in plain HTTP, behind a proxy the user runs (Caddy…).
  string mode = 1;
  int32 http_port = 2;
}

message AppStatuses {
  repeated AppStatus apps = 1;
}

message AppStatus {
  int64 app_id = 1;
  // pulling, creating, running, restarting, stopped, exited, error
  string state = 2;
  int32 exit_code = 3;
  bool oom_killed = 4;
  string error = 5;
  int64 started_at = 6;
  int32 host_port = 7; // when the app has no hostname
  int32 restart_count = 8;
  // Resource use of the running container: CPU in percent of one core, memory without the page cache.
  double cpu_percent = 9;
  uint64 memory_used_bytes = 10;
}

message StartLogs {
  string stream_id = 1;
  int64 app_id = 2;
  int32 tail = 3;
  string container_id = 4; // an external container, when app_id is 0
}

// ExternalContainers lists the node's containers that Forgeyard did not create (started by hand, by
// docker compose…), sent every few seconds. Forgeyard's own containers are left out.
message ExternalContainers {
  repeated ExternalContainer containers = 1;
}

message ExternalContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;  // running, exited, restarting, paused, created…
  string status = 5; // Docker's human-readable status, e.g. "Up 3 hours"
  int64 created_at = 6;
  repeated string ports = 7; // published ports, e.g. "8080->80/tcp"
  double cpu_percent = 8;
  uint64 memory_used_bytes = 9;
  string compose_project = 10;
}

// ContainerAction starts, stops or restarts an external container.
message ContainerAction {
  string container_id = 1;
  string action = 2; // start, stop, restart
}

message StopLogs {
  string stream_id = 1;
}

message LogLine {
  string stream_id = 1;
  string text = 2;
  bool stderr = 3;
  bool end = 4; // the stream is over (container gone or error in text)
}

// A terminal in a container: a shell with a TTY, opened by ExecStart and fed by ExecInput; its output
// comes back as ExecOutput until one with closed set.
message ExecStart {
  string session_id = 1;
  int64 app_id = 2;
  string container_id = 3; // an external container, when app_id is 0
  uint32 cols = 4;
  uint32 rows = 5;
}

message ExecInput {
  string session_id = 1;
  bytes data = 2;
}

message ExecResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ExecClose {
  string session_id = 1;
}

message ExecOutput {
  string session_id = 1;
  bytes data = 2;
  bool closed = 3;    // the shell ended: nothing follows
  int32 exit_code = 4;
  string error = 5;   // why it could not start or broke
}
